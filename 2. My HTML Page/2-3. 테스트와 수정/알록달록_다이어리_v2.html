<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알록달록 나의 하루 — 디지털 다이어리</title>
<style>
:root{color-scheme:light;--ink:#393349;--muted:#71677c;--purple:#7052a0;--line:#e8e0ee}
*{box-sizing:border-box}body{margin:0;background:#fcf8f2;color:var(--ink);font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;line-height:1.6}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.45}button:focus-visible,textarea:focus-visible{outline:3px solid #7052a0;outline-offset:3px}
main{max-width:1120px;margin:auto;padding:44px 28px 28px}.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:750;color:var(--purple)}h1{font-size:clamp(27px,4vw,40px);letter-spacing:-.05em;line-height:1.3;margin:10px 0}header p{color:var(--muted);margin:12px 0 30px}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:start}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 10px 30px #59416b06}.calendar-panel{border-top:7px solid #dbcef0}.editor-panel{border-top:7px solid #f4d1c7}.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:22px}.month-nav h2{font-size:22px;margin:0;letter-spacing:-.04em}.arrow{border:0;border-radius:14px;background:#f2edf9;width:42px;height:42px;font-size:22px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:10px}.week span:first-child{color:#ad4c5d}.day{border:1px solid transparent;border-radius:14px;background:#faf8fc;min-width:0;height:68px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}.day:hover{background:#eee6f7}.day.today{border-color:#b3a1ce}.day[aria-pressed="true"]{background:#e8ddf6;border:2px solid var(--purple);font-weight:800}.day .marker{height:21px;display:flex;align-items:center;gap:3px;font-size:14px}.dot{width:5px;height:5px;border-radius:50%;background:var(--purple);display:inline-block}.legend{font-size:12px;color:var(--muted);margin:20px 0 0;display:flex;align-items:center;gap:7px}.editor-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.editor-top h2{font-size:21px;margin:0;letter-spacing:-.04em}.weekday{font-size:13px;margin:2px 0 20px;color:var(--muted)}.sticker{background:#fff1cc;padding:8px 12px;border-radius:14px;font-size:22px;transform:rotate(8deg)}fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}legend,.body-label{display:block;font-size:14px;font-weight:750;margin-bottom:10px}.moods{display:flex;flex-wrap:wrap;gap:7px}.mood{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--mood);font-size:13px}.mood[aria-pressed="true"]{border:2px solid var(--purple);padding:7px 9px;box-shadow:0 0 0 2px #eee5fa}.mood span{margin-right:4px}textarea{display:block;resize:vertical;width:100%;min-height:255px;border:1px solid var(--line);border-radius:16px;background:#fffdf9;padding:16px;color:var(--ink);line-height:1.9}.editor-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.status{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}.status.error{color:#a13947}.delete{flex-shrink:0;border:1px solid #eacdd2;background:#fff7f7;border-radius:12px;padding:8px 12px;font-size:13px;color:#963d50}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}footer{font-size:12px;color:var(--muted);margin:25px 4px;max-width:82ch}footer p{margin:7px 0}
@media(max-width:760px){main{padding:28px 16px}.layout{grid-template-columns:1fr}.panel{padding:20px}header p{font-size:14px}.day{height:62px}}
@media(max-width:380px){main{padding:24px 12px}.panel{padding:16px}.days,.week{gap:3px}.day{height:57px;border-radius:10px}.month-nav h2{font-size:20px}.editor-top h2{font-size:19px}.mood{padding:8px}.mood[aria-pressed="true"]{padding:7px}.editor-bottom{align-items:start}textarea{min-height:230px}}
.calendar-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-6px 0 18px}.tool-button{border:1px solid #d8cbe8;border-radius:12px;background:#f2edf9;padding:8px 13px;min-height:42px;font:inherit;color:var(--purple);font-weight:700}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">MY LITTLE DIARY ✦</div><h1>알록달록 나의 하루 🌷</h1><p>평범한 순간도 소중하니까. 오늘의 이야기와 마음을 남겨요.</p></header>
<div class="layout">
<section class="panel calendar-panel" aria-label="월별 달력">
 <div class="month-nav"><button class="arrow" id="prev" aria-label="이전 달" type="button">‹</button><h2 id="month" aria-live="polite"></h2><button class="arrow" id="next" aria-label="다음 달" type="button">›</button></div>
 <div class="calendar-tools"><button type="button" class="tool-button" id="today-button">오늘로</button></div>
 <div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
 <div class="days" id="days" aria-label="날짜 선택"></div>
 <p class="legend"><span class="dot" aria-hidden="true"></span> 기록한 날 <span aria-hidden="true">·</span> 테두리는 오늘, 보라색은 선택한 날</p>
</section>
<section class="panel editor-panel" aria-labelledby="selected-date">
 <div class="editor-top"><div><h2 id="selected-date"></h2><p class="weekday" id="weekday"></p></div><span class="sticker" aria-hidden="true">✏️</span></div>
 <fieldset><legend>오늘의 기분은 어떤가요?</legend><div class="moods" id="moods"></div></fieldset>
 <label class="body-label" for="body">나의 하루</label>
 <textarea id="body" placeholder="오늘의 이야기를 자유롭게 적어 주세요." aria-describedby="input-hint"></textarea>
 <div class="editor-bottom"><p class="status" id="status" role="status" aria-live="polite"></p><button class="delete" id="delete" type="button" disabled>일기 삭제</button></div>
 <p class="hint" id="input-hint">본문 또는 기분만 남겨도 자동 저장돼요. 선택한 기분을 다시 누르면 선택이 풀려요.</p>
</section>
</div>
<footer><p>🌱 제작자 : 잉</p></footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const moods = [
 {id:'happy',text:'행복해요',emoji:'😊',color:'#fff1cb'},
 {id:'calm',text:'평온해요',emoji:'🌿',color:'#e6f3e8'},
 {id:'okay',text:'그저 그래요',emoji:'😐',color:'#eee9f9'},
 {id:'sad',text:'슬퍼요',emoji:'😢',color:'#e5effb'},
 {id:'angry',text:'화나요',emoji:'😠',color:'#fce5e1'}
];
// Keep each date independent, and separate this file's records from other files.
const prefix = 'colorful-diary-v1:' + encodeURIComponent(location.pathname) + ':';
const records = new Map(), drafts = new Map();
let loadFailed = false;
function makeDate(year,month,day){const d=new Date(0);d.setHours(12,0,0,0);d.setFullYear(year,month,day);return d;}
function keyOf(d){return String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today = new Date(), todayKey = keyOf(today);
let selected = makeDate(today.getFullYear(),today.getMonth(),today.getDate());
let viewYear=selected.getFullYear(), viewMonth=selected.getMonth();
try {
 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i);
  if(!key || !key.startsWith(prefix)) continue;
  const dateKey=key.slice(prefix.length);
  if(!/^\d{4,}-\d{2}-\d{2}$/.test(dateKey)) continue;
  const value=JSON.parse(localStorage.getItem(key));
  if(value && typeof value.body==='string' && (value.mood===null || moods.some(m=>m.id===value.mood)) && (value.body.trim() || value.mood)) records.set(dateKey,value);
 }
} catch {loadFailed=true;}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function currentDraft(){const key=keyOf(selected);return drafts.get(key)||records.get(key)||{body:'',mood:null};}
function renderCalendar(){
 $('month').textContent=viewYear+'년 '+(viewMonth+1)+'월';
 const grid=$('days');grid.replaceChildren();
 const first=makeDate(viewYear,viewMonth,1).getDay();
 const last=makeDate(viewYear,viewMonth+1,0).getDate();
 for(let i=0;i<first;i++){const blank=document.createElement('span');blank.setAttribute('aria-hidden','true');grid.append(blank);}
 for(let day=1;day<=last;day++){
  const date=makeDate(viewYear,viewMonth,day),key=keyOf(date),record=records.get(key);
  const mood=moods.find(m=>m.id===record?.mood);
  const button=document.createElement('button');button.type='button';button.className='day';
  if(key===todayKey){button.classList.add('today');button.setAttribute('aria-current','date');}
  button.setAttribute('aria-pressed',String(key===keyOf(selected)));
  button.setAttribute('aria-label',viewYear+'년 '+(viewMonth+1)+'월 '+day+'일'+(key===todayKey?', 오늘':'')+(record?', 기록 있음':'')+(mood?', '+mood.text:''));
  const number=document.createElement('span');number.textContent=day;
  const marker=document.createElement('span');marker.className='marker';marker.setAttribute('aria-hidden','true');
  if(record){const dot=document.createElement('span');dot.className='dot';marker.append(dot);}
  if(mood){const emoji=document.createElement('span');emoji.textContent=mood.emoji;marker.append(emoji);}
  button.append(number,marker);
  button.addEventListener('click',()=>{selected=date;renderCalendar();renderEditor();});grid.append(button);
 }
}
function renderMoodSelection(){const value=currentDraft();for(const button of $('moods').children)button.setAttribute('aria-pressed',String(button.dataset.mood===value.mood));}
function renderEditor(){
 const key=keyOf(selected), draft=currentDraft();
 $('selected-date').textContent=selected.getFullYear()+'년 '+(selected.getMonth()+1)+'월 '+selected.getDate()+'일';
 $('weekday').textContent=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][selected.getDay()]+'의 이야기';
 $('body').value=draft.body;renderMoodSelection();$('delete').disabled=!records.has(key);
 if(drafts.has(key))status(draft.notice||'저장하지 못했어요',true);
 else if(loadFailed)status('저장된 기록을 모두 불러오지 못했어요. 브라우저 저장 설정을 확인해 주세요.',true);
 else status(records.has(key)?'저장됨':'아직 기록이 없는 날이에요.');
}
function saveDraft(body,mood){
 const key=keyOf(selected);
 const draft={body,mood};drafts.set(key,draft);renderMoodSelection();
 if(!body.trim() && !mood){
  draft.notice=records.has(key)?'기존 기록은 유지했어요. 비우려면 일기 삭제 버튼을 사용해 주세요.':'본문이나 기분을 남겨 주세요. 빈 기록은 저장하지 않아요.';
  status(draft.notice,!!records.has(key));return;
 }
 try{
  localStorage.setItem(prefix+key,JSON.stringify({body,mood}));
  records.set(key,{body,mood});drafts.delete(key);status('저장됨');
 }catch{draft.notice='저장하지 못했어요. 입력 내용은 이 화면에 남아 있어요.';status(draft.notice,true);}
 $('delete').disabled=!records.has(key);renderCalendar();
}
for(const mood of moods){
 const button=document.createElement('button');button.type='button';button.className='mood';button.dataset.mood=mood.id;button.style.setProperty('--mood',mood.color);button.setAttribute('aria-pressed','false');
 const emoji=document.createElement('span');emoji.textContent=mood.emoji;emoji.setAttribute('aria-hidden','true');button.append(emoji,document.createTextNode(mood.text));
 button.addEventListener('click',()=>{const draft=currentDraft();saveDraft($('body').value,draft.mood===mood.id?null:mood.id);});$('moods').append(button);
}
$('body').addEventListener('input',()=>saveDraft($('body').value,currentDraft().mood));
function changeMonth(delta){const d=makeDate(viewYear,viewMonth+delta,1);viewYear=d.getFullYear();viewMonth=d.getMonth();selected=d;renderCalendar();renderEditor();}
$('prev').addEventListener('click',()=>changeMonth(-1));$('next').addEventListener('click',()=>changeMonth(1));
$('today-button').addEventListener('click',()=>{
 const now=new Date();selected=makeDate(now.getFullYear(),now.getMonth(),now.getDate());
 viewYear=selected.getFullYear();viewMonth=selected.getMonth();renderCalendar();renderEditor();
});
$('delete').addEventListener('click',()=>{
 const key=keyOf(selected);if(!records.has(key))return;
 if(!confirm(selected.getFullYear()+'년 '+(selected.getMonth()+1)+'월 '+selected.getDate()+'일의 일기를 삭제할까요?'))return;
 try{localStorage.removeItem(prefix+key);records.delete(key);drafts.delete(key);renderCalendar();renderEditor();status('일기를 삭제했어요.');}
 catch{status('저장하지 못했어요. 삭제하지 않고 기록과 입력 내용을 유지했어요.',true);}
});
window.addEventListener('beforeunload',event=>{
 if([...drafts.values()].some(d=>d.notice?.startsWith('저장하지 못했어요'))){event.preventDefault();event.returnValue='';}
});
renderCalendar();renderEditor();
</script>
</body>
</html>
